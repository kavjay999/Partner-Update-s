name: Update partner news

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest announcements
        run: python update_news.py
      - name: Commit if changed
        run: |
          git config user.name "partner-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update announcements"
            git push
          fi
